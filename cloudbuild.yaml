# Build the backend image with repo-root context (so it can COPY src/, config/, index_store/)
# but the Dockerfile living at backend/Dockerfile.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "-f", "backend/Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
